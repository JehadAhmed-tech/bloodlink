<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BloodLink - Admin Panel</title>
<style>
*{box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f6f9;margin:0;padding:20px;color:#1d3557}.admin-container{max-width:1200px;margin:0 auto}.admin-header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.admin-header h1{color:#e63946;margin:0}.admin-actions button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.refresh{background:#1d3557;color:#fff}.logout{background:#e63946;color:#fff}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:30px}.stat-card,.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.05)}.stat-card{text-align:center;border-left:5px solid #e63946}.stat-card h3{margin:0;font-size:14px;color:#666;text-transform:uppercase}.stat-card .number{font-size:28px;font-weight:bold;margin-top:10px}.card{margin-bottom:30px;overflow:auto}.card h2{margin-top:0;border-bottom:2px solid #e63946;padding-bottom:10px;font-size:20px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;text-align:left;border-bottom:1px solid #ddd}th{background:#e63946;color:#fff}.bg-tag{background:#e63946;color:#fff;padding:3px 8px;border-radius:4px;font-weight:bold}.empty-msg{text-align:center;padding:20px;color:#777}.btn-delete{background:#d90429;color:#fff;border:0;padding:7px 12px;border-radius:5px;cursor:pointer}.status{font-size:14px;color:#64748b;margin-bottom:15px}@media(max-width:700px){.stats-grid{grid-template-columns:1fr}.admin-header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="admin-container">
  <div class="admin-header"><div><h1>🩸 BloodLink Admin Dashboard</h1><div class="status" id="status">Loading...</div></div><div class="admin-actions"><button class="refresh" onclick="loadAdminData()">↻ Refresh</button><button class="logout" onclick="location.href='/'">Home</button></div></div>
  <div class="stats-grid"><div class="stat-card"><h3>Total Requests</h3><div class="number" id="statTotalRequests">0</div></div><div class="stat-card"><h3>Registered Donors</h3><div class="number" id="statTotalDonors">0</div></div><div class="stat-card"><h3>Available Donors</h3><div class="number" id="statAvailableDonors">0</div></div></div>
  <div class="card"><h2>📋 All Blood Requests</h2><table><thead><tr><th>Patient</th><th>Group</th><th>Hospital</th><th>Bags</th><th>Contact</th><th>Urgency</th><th>Action</th></tr></thead><tbody id="requestsTable"><tr><td colspan="7" class="empty-msg">Loading...</td></tr></tbody></table></div>
  <div class="card"><h2>👥 Registered Users / Donors</h2><table><thead><tr><th>Name</th><th>Email</th><th>Blood Group</th><th>Location</th><th>Phone</th><th>Availability</th></tr></thead><tbody id="usersTable"><tr><td colspan="6" class="empty-msg">Loading...</td></tr></tbody></table></div>
</div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function loadAdminData(){
 const status=document.getElementById('status'); status.textContent='Loading data...';
 try{
   const [reqRes,userRes]=await Promise.all([fetch('/api/admin/requests'),fetch('/api/admin/users')]);
   const reqData=await reqRes.json(), userData=await userRes.json();
   if(!reqRes.ok||!reqData.success) throw new Error(reqData.message||'Could not load requests');
   if(!userRes.ok||!userData.success) throw new Error(userData.message||'Could not load users');
   const requests=reqData.requests||[], users=userData.users||[];
   document.getElementById('statTotalRequests').textContent=requests.length;
   document.getElementById('statTotalDonors').textContent=users.length;
   document.getElementById('statAvailableDonors').textContent=users.length;
   const rt=document.getElementById('requestsTable');
   rt.innerHTML=requests.length?requests.map(r=>`<tr><td><strong>${esc(r.patient_name)}</strong></td><td><span class="bg-tag">${esc(r.blood_group)}</span></td><td>${esc(r.hospital_location||r.hospital)}</td><td>${esc(r.bags_needed)}</td><td>${esc(r.contact_number)}</td><td>${esc(r.urgency||'Urgent')}</td><td><button class="btn-delete" onclick="deleteRequest(${Number(r.id)})">Delete</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty-msg">No blood requests found.</td></tr>';
   const ut=document.getElementById('usersTable');
   ut.innerHTML=users.length?users.map(u=>`<tr><td><strong>${esc(u.name)}</strong></td><td>${esc(u.email)}</td><td><span class="bg-tag">${esc(u.blood_group)}</span></td><td>${esc(u.location||'N/A')}</td><td>${esc(u.phone||'N/A')}</td><td>Available</td></tr>`).join(''):'<tr><td colspan="6" class="empty-msg">No users found.</td></tr>';
   status.textContent='Live data loaded successfully.';
 }catch(e){console.error(e);status.textContent='❌ '+e.message;}
}
async function deleteRequest(id){
 if(!confirm('Delete this blood request?')) return;
 try{const res=await fetch('/api/admin/requests/'+id,{method:'DELETE'});const data=await res.json();if(!res.ok||!data.success)throw new Error(data.message||'Delete failed');alert('Request deleted successfully.');loadAdminData();}catch(e){alert('❌ '+e.message);}
}
window.addEventListener('load',loadAdminData);
</script>
</body>
</html>
