<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink - Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .admin-container { max-width: 1100px; margin: 0 auto; }
        .admin-header { text-align: center; margin-bottom: 25px; }
        .admin-header h1 { color: #e63946; margin: 0; }

        /* Stats Cards Layout */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; border-left: 5px solid #e63946; }
        .stat-card h3 { margin: 0; font-size: 14px; color: #666; text-transform: uppercase; }
        .stat-card .number { font-size: 28px; font-weight: bold; color: #1d3557; margin-top: 10px; }

        /* Table Card Styling */
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .card h2 { margin-top: 0; color: #1d3557; border-bottom: 2px solid #e63946; padding-bottom: 10px; font-size: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #e63946; color: white; }
        .bg-tag { background: #e63946; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .empty-msg { text-align: center; padding: 20px; color: #777; }

        /* Delete Button */
        .btn-delete { background: #d90429; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-delete:hover { background: #b8001f; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="admin-header">
        <h1>🩸 BloodLink Admin Dashboard</h1>
    </div>

    <!-- 📊 Stats Overview -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Requests</h3>
            <div class="number" id="statTotalRequests">0</div>
        </div>
        <div class="stat-card">
            <h3>Registered Donors</h3>
            <div class="number" id="statTotalDonors">0</div>
        </div>
        <div class="stat-card">
            <h3>Active Status</h3>
            <div class="number" style="color: #2b9348;">Live</div>
        </div>
    </div>

    <!-- 📋 Blood Requests Table -->
    <div class="card">
        <h2>📋 All Blood Requests</h2>
        <table>
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Group</th>
                    <th>Hospital</th>
                    <th>Requirement</th>
                    <th>Contact</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="requestsTable">
                <tr><td colspan="6" class="empty-msg">Loading requests...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 👥 Registered Donors Table -->
    <div class="card">
        <h2>👥 Registered Users / Donors</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Blood Group</th>
                    <th>Phone</th>
                </tr>
            </thead>
            <tbody id="usersTable">
                <tr><td colspan="4" class="empty-msg">Loading users...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadAdminData() {
        // 1. Fetch Blood Requests
        try {
            const userRes = await fetch('/api/admin/users');
            const userData = await userRes.json();
            const userTable = document.getElementById('usersTable');

        if (userData.success && userData.users.length > 0) {
            document.getElementById('statTotalDonors').innerText = userData.users.length;

                userTable.innerHTML = userData.users.map(u => `
                    <tr>
                        <td><strong>${r.patient_name || 'N/A'}</strong></td>
                        <td><span class="bg-tag">${r.blood_group || 'N/A'}</span></td>
                        <td>${r.hospital_location || 'N/A'}</td>
                        <td>${r.bags_needed ? r.bags_needed + ' Bag(s)' : 'N/A'}</td>
                        <td>${r.contact_number || 'N/A'}</td>
                        <td>
                            <button class="btn-delete" onclick="deleteRequest(${r.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } else {
                document.getElementById('statTotalRequests').innerText = '0';
                reqTable.innerHTML = '<tr><td colspan="6" class="empty-msg">No blood requests found.</td></tr>';
            }
        } catch (e) {
            console.error('Error loading requests:', e);
        }

        // 2. Fetch Registered Users
        try {
            const userRes = await fetch('/api/donors');
            const userData = await userRes.json();
            const userTable = document.getElementById('usersTable');
            
            if (userData.success && userData.donors.length > 0) {
                document.getElementById('statTotalDonors').innerText = userData.donors.length;
                
                userTable.innerHTML = userData.donors.map(u => `
                    <tr>
                        <td><strong>${u.name || 'User'}</strong></td>
                        <td>${u.email || 'N/A'}</td>
                        <td><span class="bg-tag">${u.blood_group || 'N/A'}</span></td>
                        <td>${u.phone || 'N/A'}</td>
                    </tr>
                `).join('');
            } else {
                document.getElementById('statTotalDonors').innerText = '0';
                userTable.innerHTML = '<tr><td colspan="4" class="empty-msg">No users found.</td></tr>';
            }
        } catch (e) {
            console.error('Error loading donors:', e);
        }
    }

    // Function to Delete a Request
    async function deleteRequest(id) {
        if (!confirm('Are you sure you want to delete this request?')) return;

        try {
            const res = await fetch(`/api/admin/requests/${id}`, { method: 'DELETE' });
            const data = await res.json();
            
            if (data.success) {
                alert('Request deleted successfully!');
                loadAdminData(); // Refresh table
            } else {
                alert('Failed to delete request.');
            }
        } catch (e) {
            alert('Error deleting request.');
        }
    }

    window.onload = loadAdminData;
</script>

</body>
</html>
