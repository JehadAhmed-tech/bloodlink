<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink - Sign In & Register</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
        }
        .auth-card h2 {
            text-align: center;
            color: #e63946;
            margin-bottom: 20px;
        }
        .tab-btns {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            color: #e63946;
            border-bottom: 2px solid #e63946;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #d62828;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="auth-card">
    <h2>🩸 BloodLink</h2>

    <div class="tab-btns">
        <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="regTab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Md. Rahim" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="••••••••" required>
        </div>
        <div class="form-group">
            <label>Blood Group</label>
            <select id="regBloodGroup">
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
        </div>
        <button type="submit" class="submit-btn">Register Account</button>
    </form>
</div>

<script>
    function switchTab(tab) {
        if(tab === 'login') {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('regTab').classList.remove('active');
        } else {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('regTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
        }
    }

    // Handle Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if(data.success) {
                alert('🎉 Login successful!');
                localStorage.setItem('user', JSON.stringify(data.user)); // Save user session
                window.location.href = '/'; // Go to Main Home Page
            } else {
                alert('❌ ' + data.message);
            }
        } catch(err) {
            alert('Server error!');
        }
    });

    // Handle Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = {
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            blood_group: document.getElementById('regBloodGroup').value
        };

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            const data = await res.json();

            if(data.success) {
                alert('🎉 Account created! Please Sign In now.');
                switchTab('login'); // Switch to login form automatically
            } else {
                alert('❌ ' + data.message);
            }
        } catch(err) {
            alert('Server error!');
        }
    });
</script>

</body>
</html>
