<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BloodLink - Sign In & Register</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;font-family:'Segoe UI',Tahoma,sans-serif;background:radial-gradient(circle at top,#2a1420 0,#0f172a 45%,#080d16 100%);color:#fff;display:flex;align-items:center;justify-content:center}.auth-card{width:100%;max-width:430px;background:rgba(30,41,59,.96);padding:30px;border:1px solid rgba(255,255,255,.08);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}.brand{text-align:center;font-size:28px;font-weight:700;margin-bottom:8px}.brand span{margin-right:7px}.subtitle{text-align:center;color:#94a3b8;margin:0 0 24px}.tab-btns{display:flex;margin-bottom:22px;border-bottom:1px solid #334155}.tab-btn{flex:1;padding:12px;background:none;border:0;color:#94a3b8;font-size:16px;cursor:pointer;font-weight:700}.tab-btn.active{color:#ff3b3b;border-bottom:2px solid #ff3b3b}.form-group{margin-bottom:15px}.form-group label{display:block;margin-bottom:7px;font-size:13px;color:#cbd5e1;font-weight:700}.form-group input,.form-group select{width:100%;padding:12px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none}.form-group input:focus,.form-group select:focus{border-color:#ff3b3b}.submit-btn{width:100%;padding:13px;background:#ff3b3b;color:#fff;border:0;border-radius:9px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}.submit-btn:hover{background:#e52f2f}.hidden{display:none!important}.back-link{display:block;text-align:center;margin-top:18px;color:#94a3b8;text-decoration:none}.back-link:hover{color:#fff}.error{color:#ff8a8a;text-align:center;min-height:20px;margin:10px 0 0;font-size:14px}.success{color:#86efac;text-align:center;min-height:20px;margin:10px 0 0;font-size:14px}
</style>
</head>
<body>
<div class="auth-card">
  <div class="brand"><span>🩸</span>BloodLink</div>
  <p class="subtitle">Emergency blood donation network</p>
  <div class="tab-btns">
    <button class="tab-btn active" id="loginTab" type="button" onclick="switchTab('login')">Sign In</button>
    <button class="tab-btn" id="regTab" type="button" onclick="switchTab('register')">Register</button>
  </div>

  <form id="loginForm">
    <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="your@email.com" required></div>
    <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••" minlength="6" required></div>
    <button type="submit" class="submit-btn">Sign In</button>
    <div id="loginMessage" class="error"></div>
  </form>

  <form id="registerForm" class="hidden">
    <div class="form-group"><label>FULL NAME</label><input type="text" id="regName" name="name" placeholder="Md. Rahim" required></div>
    <div class="form-group"><label>EMAIL</label><input type="email" id="regEmail" name="email" placeholder="your@email.com" required></div>
    <div class="form-group"><label>PASSWORD</label><input type="password" id="regPassword" name="password" placeholder="Minimum 6 characters" minlength="6" required></div>
    <div class="form-group"><label>BLOOD GROUP</label><select id="regBloodGroup" name="blood_group" required><option value="" disabled selected>Select blood group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div>
    <div class="form-group"><label>LOCATION / CITY</label><input type="text" id="regLocation" name="location" placeholder="Dhaka" required></div>
    <div class="form-group"><label>PHONE NUMBER</label><input type="tel" id="regPhone" name="phone" placeholder="017XXXXXXXX" required></div>
    <button type="submit" class="submit-btn">Register Account</button>
    <div id="registerMessage" class="error"></div>
  </form>
  <a class="back-link" href="/">← Back to BloodLink</a>
</div>
<script>
function switchTab(tab){
  const login=tab==='login';
  document.getElementById('loginForm').classList.toggle('hidden',!login);
  document.getElementById('registerForm').classList.toggle('hidden',login);
  document.getElementById('loginTab').classList.toggle('active',login);
  document.getElementById('regTab').classList.toggle('active',!login);
  document.getElementById('loginMessage').textContent='';
  document.getElementById('registerMessage').textContent='';
}
if(localStorage.getItem('user')) window.location.href='/';

document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=document.getElementById('loginMessage'); msg.className='error'; msg.textContent='Signing in...';
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPassword').value})});
    const data=await res.json();
    if(!res.ok||!data.success) throw new Error(data.message||'Sign in failed.');
    localStorage.setItem('user',JSON.stringify(data.user));
    msg.className='success'; msg.textContent='Login successful!';
    window.location.href='/';
  }catch(err){msg.className='error';msg.textContent='❌ '+err.message;}
});

document.getElementById('registerForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=document.getElementById('registerMessage'); msg.className='error'; msg.textContent='Creating account...';
  const formData=Object.fromEntries(new FormData(e.target).entries());
  try{
    const res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(formData)});
    const data=await res.json();
    if(!res.ok||!data.success) throw new Error(data.message||'Registration failed.');
    msg.className='success'; msg.textContent='Account created. Please sign in.';
    e.target.reset();
    setTimeout(()=>switchTab('login'),500);
  }catch(err){msg.className='error';msg.textContent='❌ '+err.message;}
});
</script>
</body>
</html>
